<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- Source of the bot's menu banner. Rendered to public/barber-banner.png (1280x640). -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: #120e0b; }
  .banner {
    position: relative; width: 1280px; height: 640px; padding: 70px 90px;
    display: flex; flex-direction: column; justify-content: center;
    background:
      radial-gradient(60% 90% at 88% 20%, rgba(214, 166, 92, 0.28), transparent 70%),
      radial-gradient(50% 80% at 0% 100%, rgba(140, 40, 30, 0.35), transparent 70%),
      #120e0b;
    color: #f4e8d4; font-family: "Rubik", sans-serif;
  }
  /* Barber pole stripes along the left edge */
  .pole {
    position: absolute; left: 0; top: 0; bottom: 0; width: 34px;
    background: repeating-linear-gradient(-45deg, #c0392b 0 22px, #f4e8d4 22px 44px, #2a5db0 44px 66px, #f4e8d4 66px 88px);
  }
  .tag { font-size: 26px; letter-spacing: 0.34em; text-transform: uppercase; color: #d6a65c; margin-bottom: 22px; }
  h1 { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 128px; line-height: 0.98; text-transform: uppercase; letter-spacing: 0.01em; }
  h1 span { color: #d6a65c; }
  .sub { margin-top: 34px; font-size: 34px; color: #c9b9a0; }
  .badge {
    margin-top: 40px; align-self: flex-start; padding: 14px 34px; border: 2px solid #d6a65c;
    border-radius: 999px; font-size: 28px; font-weight: 500; color: #d6a65c;
  }
  svg.scissors { position: absolute; right: 60px; top: 110px; width: 330px; height: 330px; opacity: 0.95;
    fill: none; stroke: #d6a65c; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55)); transform: rotate(-18deg); }
</style>
</head>
<body>
  <div class="banner">
    <div class="pole"></div>
    <p class="tag">Барбершоп</p>
    <h1>Борода<br>и <span>ножницы</span></h1>
    <p class="sub">Стрижки, борода, королевское бритьё</p>
    <p class="badge">Запись онлайн за минуту</p>
    <svg class="scissors" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="27" cy="76" r="13"/><circle cx="73" cy="76" r="13"/>
      <path d="M34 66 L72 12"/><path d="M66 66 L28 12"/>
      <circle cx="50" cy="41" r="2.5" fill="#d6a65c" stroke="none"/>
    </svg>
  </div>
</body>
</html>
